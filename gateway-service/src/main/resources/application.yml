server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

app:
  checkout-service-uri: ${CHECKOUT_SERVICE_URI:http://localhost:8081}
  tracking-service-uri: ${TRACKING_SERVICE_URI:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.flashsale: INFO
