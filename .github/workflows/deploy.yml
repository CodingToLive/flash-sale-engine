name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, checkout, order-processing, notification, tracking]
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path even if the GitHub username/org has
      # uppercase letters.
      - name: Compute lowercase image namespace
        run: echo "IMAGE_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cross-builds for linux/arm64 since the Oracle Cloud free-tier VM is an
      # Ampere A1 (ARM) instance. QEMU keeps this portable across any ubuntu-latest
      # runner; swap for a native arm64 runner (ubuntu-24.04-arm) if available on
      # your account for faster builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/flash-sale-${{ matrix.service }}:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/flash-sale-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Expects docker-compose.prod.yml, Caddyfile, frontend/ and a real .env to
      # already exist in /opt/flash-sale-system on the VM (one-time manual setup,
      # see infra/oracle-vm-setup.md) - this job only pulls fresh images and
      # restarts the stack.
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd /opt/flash-sale-system
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
